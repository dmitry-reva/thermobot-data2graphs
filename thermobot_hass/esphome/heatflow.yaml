# ==============================================================================
# ESPHome Configuration (Tested version: ESPHome 2026.9.1)
# NOTE: sound level/frequency/duration and sensor calibration are new in this
#       revision - verify on first build
# ==============================================================================
# Board:       Thermobot-2 Mini
# Manufacturer: 42unita.ru (https://www.42unita.ru)
# Device Name: HeatFlow
# Purpose:     DS18B20 temperature sensing (supply/return) with manual calibration,
#              LED status indication, Wi‑Fi connectivity with boot/connect
#              audible/visual alerts, temperature alarm (low/high thresholds)
#              with repeating buzzer signal.
# Sensors:     Dallas DS18B20 (one‑wire) on GPIO0. Number of sensors is optional.
# Outputs:     LED on GPIO2, passive buzzer on GPIO12 (software PWM:
#              adjustable volume, frequency and duration)
# Inputs:      Button on GPIO14 (optional, remove the block if not fitted)
# ==============================================================================

substitutions:
  devicename: heatflow
  upper_devicename: HeatFlow
  model: Dual
  devicefriendlyname: ${upper_devicename} ${model}
  wifi_ssid: !secret wifi_0f
  wifi_pass: !secret wifi_password
  web_server_user: ${devicename}
  web_server_pass: !secret web_server_pass
  api_key: !secret api_key
  # addresses ds18b20 (dallas_temp)
  addr_supply: "0x00000000b34d1328" #требует замены
  addr_return: "0xb7000000cb2eb328" #требует замены
  # manual calibration offsets, °C (adjustable later from Home Assistant / web UI)
  # supply: 3.5 is the offset that was previously hard-coded in the sensor filter
  cal_supply_default: "3.5"
  cal_return_default: "0"
  # temperature alarm defaults (adjustable later from Home Assistant / web UI)
  alarm_low_default: "5"
  alarm_high_default: "90"
  alarm_interval_default: "60"
  # buzzer defaults (adjustable later from Home Assistant / web UI).
  # Original Thermobot signal: 3000 Hz, 100 ms, 50 % duty (= volume 100 %)
  sound_volume_default: "100"
  sound_frequency_default: "3000"
  sound_duration_default: "100"

esphome:
  name: ${devicename}
  friendly_name: ${devicefriendlyname}
  name_add_mac_suffix: false
  on_boot:
    - then: 
        - script.execute: blink_led
        - script.execute: beep

esp8266:
  board: nodemcuv2

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_pass}
  ap:
    ssid: ${devicefriendlyname}
    password: ${web_server_pass}
  on_connect:
    then:
      - script.execute: beep
      - repeat:
          count: 4
          then:
            - script.execute: blink_led
            - delay: 300ms 

captive_portal:

web_server:
  port: 80
  local: true
  version: 2
  log: false
  auth:
    username: ${web_server_user}
    password: ${web_server_pass}
    type: digest
    
logger:
  level: WARN
  baud_rate: 0

one_wire:
  - platform: gpio
    id: bus_gpio0
    pin: GPIO0

sensor:
  # Calibration is applied to the raw reading: value = raw + "<sensor> calibration".
  # A changed calibration takes effect from the next measurement (update_interval).
  - platform: dallas_temp
    one_wire_id: bus_gpio0
    address: ${addr_supply}
    name: "Supply temperature"
    id: supply_temp
    filters:
      - lambda: |-
          float c = id(cal_supply).state;
          return std::isnan(c) ? x : x + c;
    update_interval: 30s
    accuracy_decimals: 2
    icon: "mdi:temperature-celsius"

  - platform: dallas_temp
    one_wire_id: bus_gpio0
    address: ${addr_return}
    name: "Return temperature"
    id: return_temp
    filters:
      - lambda: |-
          float c = id(cal_return).state;
          return std::isnan(c) ? x : x + c;
    update_interval: 30s
    accuracy_decimals: 2
    icon: "mdi:temperature-celsius"

  - platform: wifi_signal
    name: ${upper_devicename} WiFi Signal
    device_class: signal_strength
    update_interval: 60s
    unit_of_measurement: "dB"
    accuracy_decimals: 0
     
  - platform: uptime
    name: ${upper_devicename} Uptime Sensor
    id: uptime_sensor
    internal: false
    update_interval: 300s
    icon: "mdi:timer"

binary_sensor:
  # Alarm is active when any available DS18B20 (calibrated value) is outside
  # [low, high]. A missing sensor (no state / NaN) never triggers the alarm.
  - platform: template
    name: "Temperature alarm"
    id: temp_alarm
    device_class: problem
    icon: "mdi:thermometer-alert"
    lambda: |-
      auto out_of_range = [](float t, float lo, float hi) {
        return !std::isnan(t) && (t < lo || t > hi);
      };
      float lo = id(alarm_low).state;
      float hi = id(alarm_high).state;
      return out_of_range(id(supply_temp).state, lo, hi) ||
             out_of_range(id(return_temp).state, lo, hi);
    on_press:
      then:
        - script.execute: alarm_loop

  # Optional hardware button (Thermobot: GPIO14, input with pull-up, active low)
  - platform: gpio
    name: "Button"
    id: button_gpio14
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    icon: "mdi:gesture-tap-button"

number:
  # --- manual calibration (offset added to the sensor reading) ---
  - platform: template
    name: "Supply calibration"
    id: cal_supply
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial_value: ${cal_supply_default}
    optimistic: true
    restore_value: true
    icon: "mdi:thermometer-plus"

  - platform: template
    name: "Return calibration"
    id: cal_return
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial_value: ${cal_return_default}
    optimistic: true
    restore_value: true
    icon: "mdi:thermometer-plus"

  # --- temperature alarm ---
  - platform: template
    name: "Alarm low temperature"
    id: alarm_low
    min_value: -55
    max_value: 125
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial_value: ${alarm_low_default}
    optimistic: true
    restore_value: true
    icon: "mdi:thermometer-low"

  - platform: template
    name: "Alarm high temperature"
    id: alarm_high
    min_value: -55
    max_value: 125
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial_value: ${alarm_high_default}
    optimistic: true
    restore_value: true
    icon: "mdi:thermometer-high"

  - platform: template
    name: "Alarm repeat interval"
    id: alarm_interval
    min_value: 1
    max_value: 86400
    step: 1
    unit_of_measurement: "s"
    mode: box
    initial_value: ${alarm_interval_default}
    optimistic: true
    restore_value: true
    icon: "mdi:timer-sand"

  # --- buzzer ---
  # Volume is the amplitude of the signal: 100 % = 50 % PWM duty (maximum for a
  # square wave), lower values narrow the pulses.
  - platform: template
    name: "Sound volume"
    id: sound_volume
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    initial_value: ${sound_volume_default}
    optimistic: true
    restore_value: true
    icon: "mdi:volume-medium"

  # A piezo buzzer is loudest near its resonance frequency (usually 2-4 kHz):
  # press "Beep test" and change this value to find the loudest point.
  - platform: template
    name: "Sound frequency"
    id: sound_frequency
    min_value: 500
    max_value: 5000
    step: 50
    unit_of_measurement: "Hz"
    mode: box
    initial_value: ${sound_frequency_default}
    optimistic: true
    restore_value: true
    icon: "mdi:sine-wave"

  - platform: template
    name: "Sound duration"
    id: sound_duration
    min_value: 20
    max_value: 2000
    step: 10
    unit_of_measurement: "ms"
    mode: box
    initial_value: ${sound_duration_default}
    optimistic: true
    restore_value: true
    icon: "mdi:timer-outline"

output:
  - platform: gpio
    pin: GPIO2
    inverted: true
    id: led_gpio

  # Passive buzzer (software PWM; frequency and duty are set by script buzzer_tone)
  - platform: esp8266_pwm
    pin: GPIO12
    id: buzzer_out

switch:
  - platform: output
    output: led_gpio
    name: "Led"
    id: led_switch
    icon: "mdi:lightbulb"

  # Master mute for boot/connect/alarm beeps
  - platform: template
    name: "Sound"
    id: sound_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:volume-high"

button:
  # Test beep ignores the "Sound" mute switch
  - platform: template
    name: "Beep test"
    id: beep_test
    icon: "mdi:bell-ring"
    on_press:
      then:
        - script.execute: buzzer_tone

script:
  - id: blink_led
    mode: single
    then:
      - switch.turn_on: led_switch
      - delay: 200ms
      - switch.turn_off: led_switch

  # Plays one tone with the current volume / frequency / duration settings
  - id: buzzer_tone
    mode: single
    then:
      - output.esp8266_pwm.set_frequency:
          id: buzzer_out
          frequency: !lambda |-
            float f = id(sound_frequency).state;
            return std::isnan(f) ? 3000.0f : f;
      - output.set_level:
          id: buzzer_out
          level: !lambda |-
            float v = id(sound_volume).state;
            if (std::isnan(v)) v = 100.0f;
            // amplitude of a square wave ~ sin(pi * duty): volume 100 % -> duty 50 %
            return std::asin(v / 100.0f) / 3.14159265f;
      - delay: !lambda |-
          float d = id(sound_duration).state;
          return (uint32_t) (std::isnan(d) ? 100.0f : d);
      - output.set_level:
          id: buzzer_out
          level: 0%

  # One short beep (respects the "Sound" switch)
  - id: beep
    mode: single
    then:
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - script.execute: buzzer_tone

  # While the alarm is active: blink + beep, repeat every "Alarm repeat interval"
  - id: alarm_loop
    mode: single
    then:
      - while:
          condition:
            binary_sensor.is_on: temp_alarm
          then:
            - script.execute: blink_led
            - script.execute: beep
            - delay: !lambda 'return (uint32_t) (id(alarm_interval).state * 1000);'
