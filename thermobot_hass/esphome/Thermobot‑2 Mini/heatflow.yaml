# ==============================================================================
# ESPHome Configuration (Tested version: ESPHome 2026.9.1)
# Recommended after testing: ESPHome 2026.10+ (native ESP8266 builds,
# compressed OTA). See README.md for the upgrade notes.
# NOTE: sound level/frequency/duration and sensor calibration are new in this
#       revision - verify on first build.
# ==============================================================================
# Board:       Thermobot-2 Mini
# Manufacturer: 42unita.ru (https://www.42unita.ru)
# Device Name: HeatFlow
# Purpose:     DS18B20 temperature sensing (supply/return) with manual calibration,
#              LED status indication, Wi-Fi connectivity with boot/connect
#              audible/visual alerts, per-sensor temperature alarm (low/high)
#              with repeating buzzer signal and acknowledge button.
# Sensors:     Dallas DS18B20 (one-wire) on GPIO0. Number of sensors is optional.
# Outputs:     LED on GPIO2, passive buzzer on GPIO12 (software PWM:
#              adjustable volume, frequency and duration)
# Inputs:      Button on GPIO14 (optional; short click acknowledges the alarm)
# ==============================================================================

substitutions:
  devicename: heatflow
  upper_devicename: HeatFlow
  model: Dual
  devicefriendlyname: ${upper_devicename} ${model}
  wifi_ssid: !secret wifi_0f
  wifi_pass: !secret wifi_password
  web_server_user: ${devicename}
  web_server_pass: !secret web_server_pass
  api_key: !secret api_key
  # addresses ds18b20 (dallas_temp)
  addr_supply: "0x00000000b34d1328" #требует замены
  addr_return: "0xb7000000cb2eb328" #требует замены
  # manual calibration offsets, °C (adjustable later from Home Assistant / web UI)
  # supply: 3.5 is the offset that was previously hard-coded in the sensor filter
  cal_supply_default: "3.5"
  cal_return_default: "0"
  # temperature alarm defaults per sensor, °C (adjustable later from HA / web UI)
  alarm_supply_low_default: "5"
  alarm_supply_high_default: "90"
  alarm_return_low_default: "5"
  alarm_return_high_default: "90"
  alarm_interval_default: "60"
  # buzzer defaults (adjustable later from Home Assistant / web UI).
  # Original Thermobot signal: 3000 Hz, 100 ms, 50 % duty (= volume 100 %)
  sound_volume_default: "100"
  sound_frequency_default: "3000"
  sound_duration_default: "100"

esphome:
  name: ${devicename}
  friendly_name: ${devicefriendlyname}
  name_add_mac_suffix: false
  comment: "Thermobot-2 Mini: supply/return DS18B20, per-sensor alarm, buzzer, LED"
  # Set this to the area that is actually used in Home Assistant.
  area: "Heating"
  project:
    name: "dmitry-reva.thermobot_data2graphs"
    version: "1.2.0"
  min_version: "2026.9.1"
  on_boot:
    - then:
        - script.execute: blink_led
        - script.execute: beep

esp8266:
  board: nodemcuv2
  # Required for restore_value/restore_mode to survive a power loss on ESP8266.
  # Default flash_write_interval in the preferences component is 1 minute.
  restore_from_flash: true

api:
  encryption:
    key: ${api_key}
  # Do not reboot the device just because Home Assistant is temporarily down.
  # Wi-Fi recovery is still handled by wifi.reboot_timeout (default 15 min).
  reboot_timeout: 0s

ota:
  - platform: esphome
    # No legacy OTA password: on a trusted LAN the API channel is already
    # encrypted. On ESPHome 2026.9+ encrypted OTA uses the API key; check the
    # OTA docs for your exact version before adding a password.

safe_mode:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_pass}
  # Optional static IP. A DHCP reservation on the router is usually simpler.
  # manual_ip:
  #   static_ip: 192.168.100.50
  #   gateway: 192.168.100.1
  #   subnet: 255.255.255.0
  ap:
    ssid: ${devicefriendlyname}
    password: ${web_server_pass}
  on_connect:
    then:
      - script.execute: beep
      - repeat:
          count: 4
          then:
            - script.execute: blink_led
            - delay: 300ms

captive_portal:

web_server:
  port: 80
  local: true
  version: 2
  log: false
  auth:
    username: ${web_server_user}
    password: ${web_server_pass}
    type: digest

logger:
  level: WARN
  baud_rate: 0

one_wire:
  - platform: gpio
    id: bus_gpio0
    pin: GPIO0

sensor:
  # Calibration is applied to the raw reading: value = raw + "<sensor> calibration".
  # A changed calibration takes effect from the next measurement (update_interval).
  - platform: dallas_temp
    one_wire_id: bus_gpio0
    address: ${addr_supply}
    name: "Supply temperature"
    id: supply_temp
    filters:
      # Optional smoothing (adds lag; do not enable for alarm-critical values):
      # - median:
      #     window_size: 5
      #     send_every: 5
      - lambda: |-
          float c = id(cal_supply).state;
          return std::isnan(c) ? x : x + c;
    update_interval: 30s
    accuracy_decimals: 2
    icon: "mdi:temperature-celsius"

  - platform: dallas_temp
    one_wire_id: bus_gpio0
    address: ${addr_return}
    name: "Return temperature"
    id: return_temp
    filters:
      # Optional smoothing (see the note above).
      - lambda: |-
          float c = id(cal_return).state;
          return std::isnan(c) ? x : x + c;
    update_interval: 30s
    accuracy_decimals: 2
    icon: "mdi:temperature-celsius"

  # dBm, signal_strength, measurement and diagnostic are the platform defaults.
  - platform: wifi_signal
    name: "WiFi Signal"
    device_class: signal_strength
    update_interval: 60s
    accuracy_decimals: 0

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    internal: false
    update_interval: 300s
    icon: "mdi:timer"

  # Difference between supply and return; useful for heating diagnostics.
  - platform: template
    name: "Delta temperature"
    id: delta_temp
    unit_of_measurement: "°C"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    icon: "mdi:thermometer-chevron-up"
    lambda: |-
      if (std::isnan(id(supply_temp).state) || std::isnan(id(return_temp).state)) {
        return NAN;
      }
      return id(supply_temp).state - id(return_temp).state;

binary_sensor:
  # Alarm is active when any available DS18B20 (calibrated value) is outside
  # its own [low, high] range. A missing sensor (NaN) never triggers this alarm;
  # it is reported by "Temperature sensor fault" below instead.
  - platform: template
    name: "Temperature alarm"
    id: temp_alarm
    device_class: problem
    icon: "mdi:thermometer-alert"
    # Fire on the first valid state too, otherwise a reboot while already in
    # alarm would not start alarm_loop.
    trigger_on_initial_state: true
    filters:
      - delayed_on: 5s
      - delayed_off: 30s
    lambda: |-
      auto out_of_range = [](float t, float lo, float hi) {
        return !std::isnan(t) && (t < lo || t > hi);
      };
      return out_of_range(id(supply_temp).state,
                          id(alarm_supply_low).state,
                          id(alarm_supply_high).state) ||
             out_of_range(id(return_temp).state,
                          id(alarm_return_low).state,
                          id(alarm_return_high).state);
    on_press:
      then:
        - script.execute: alarm_loop
    on_release:
      then:
        - script.execute: stop_alarm

  # dallas_temp publishes NAN when a probe cannot be read. This entity makes
  # that condition visible in Home Assistant and available for notifications.
  - platform: template
    name: "Temperature sensor fault"
    id: sensor_fault
    device_class: problem
    icon: "mdi:thermometer-off"
    lambda: |-
      return std::isnan(id(supply_temp).state) ||
             std::isnan(id(return_temp).state);
    filters:
      # Ignore the first 90 s after boot while both probes are still starting.
      - delayed_on: 90s
      - delayed_off: 30s

  # Optional hardware button (Thermobot: GPIO14, input with pull-up, active low).
  # A short click acknowledges (silences) the local alarm.
  - platform: gpio
    name: "Physical button"
    id: button_gpio14
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:gesture-tap-button"
    on_click:
      min_length: 50ms
      max_length: 1s
      then:
        - if:
            condition:
              binary_sensor.is_on: temp_alarm
            then:
              - script.execute: stop_alarm

  - platform: status
    name: "Status"
    entity_category: diagnostic

number:
  # --- manual calibration (offset added to the sensor reading) ---
  - platform: template
    name: "Supply calibration"
    id: cal_supply
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial_value: ${cal_supply_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:thermometer-plus"

  - platform: template
    name: "Return calibration"
    id: cal_return
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial_value: ${cal_return_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:thermometer-plus"

  # --- temperature alarm, separate thresholds per sensor ---
  - platform: template
    name: "Supply alarm low"
    id: alarm_supply_low
    min_value: -55
    max_value: 125
    step: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    initial_value: ${alarm_supply_low_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:thermometer-low"

  - platform: template
    name: "Supply alarm high"
    id: alarm_supply_high
    min_value: -55
    max_value: 125
    step: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    initial_value: ${alarm_supply_high_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:thermometer-high"

  - platform: template
    name: "Return alarm low"
    id: alarm_return_low
    min_value: -55
    max_value: 125
    step: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    initial_value: ${alarm_return_low_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:thermometer-low"

  - platform: template
    name: "Return alarm high"
    id: alarm_return_high
    min_value: -55
    max_value: 125
    step: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    initial_value: ${alarm_return_high_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:thermometer-high"

  - platform: template
    name: "Alarm repeat interval"
    id: alarm_interval
    min_value: 1
    max_value: 86400
    step: 1
    unit_of_measurement: "s"
    device_class: duration
    mode: box
    initial_value: ${alarm_interval_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:timer-sand"

  # --- buzzer ---
  # Volume is the amplitude of the signal: 100 % = 50 % PWM duty (maximum for a
  # square wave), lower values narrow the pulses.
  - platform: template
    name: "Sound volume"
    id: sound_volume
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    initial_value: ${sound_volume_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:volume-medium"

  # A piezo buzzer is loudest near its resonance frequency (usually 2-4 kHz):
  # press "Beep test" and change this value to find the loudest point.
  - platform: template
    name: "Sound frequency"
    id: sound_frequency
    min_value: 500
    max_value: 5000
    step: 50
    unit_of_measurement: "Hz"
    device_class: frequency
    mode: box
    initial_value: ${sound_frequency_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:sine-wave"

  - platform: template
    name: "Sound duration"
    id: sound_duration
    min_value: 20
    max_value: 2000
    step: 10
    unit_of_measurement: "ms"
    device_class: duration
    mode: box
    initial_value: ${sound_duration_default}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:timer-outline"

output:
  - platform: gpio
    pin: GPIO2
    inverted: true
    id: led_gpio

  # Passive buzzer (software PWM; frequency and duty are set by script buzzer_tone)
  - platform: esp8266_pwm
    pin: GPIO12
    id: buzzer_out

switch:
  - platform: output
    output: led_gpio
    name: "LED"
    id: led_switch
    entity_category: config
    icon: "mdi:lightbulb"

  # Master mute for boot/connect/alarm beeps
  - platform: template
    name: "Sound"
    id: sound_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: "mdi:volume-high"
    on_turn_off:
      then:
        # Stop a tone that is already playing; otherwise it would finish even
        # though the user just muted the device.
        - script.stop: buzzer_tone
        - output.set_level:
            id: buzzer_out
            level: 0%

button:
  # Test beep ignores the "Sound" mute switch
  - platform: template
    name: "Beep test"
    id: beep_test
    icon: "mdi:bell-ring"
    entity_category: diagnostic
    on_press:
      then:
        - script.execute: buzzer_tone

  # Silences the local alarm until the temperature returns to normal.
  # The "Temperature alarm" entity in Home Assistant stays on.
  - platform: template
    name: "Acknowledge alarm"
    id: ack_alarm
    icon: "mdi:bell-off"
    entity_category: diagnostic
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: temp_alarm
            then:
              - script.execute: stop_alarm

  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Safe mode"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
    bssid:
      name: "BSSID"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    disabled_by_default: true

script:
  - id: blink_led
    mode: single
    then:
      - switch.turn_on: led_switch
      - delay: 200ms
      - switch.turn_off: led_switch

  # Plays one tone with the current volume / frequency / duration settings
  - id: buzzer_tone
    mode: single
    then:
      - output.esp8266_pwm.set_frequency:
          id: buzzer_out
          frequency: !lambda |-
            float f = id(sound_frequency).state;
            return std::isnan(f) ? 3000.0f : f;
      - output.set_level:
          id: buzzer_out
          level: !lambda |-
            float v = id(sound_volume).state;
            if (std::isnan(v)) v = 100.0f;
            // amplitude of a square wave ~ sin(pi * duty): volume 100 % -> duty 50 %
            return std::asin(v / 100.0f) / 3.14159265f;
      - delay: !lambda |-
          float d = id(sound_duration).state;
          return (uint32_t) (std::isnan(d) ? 100.0f : d);
      - output.set_level:
          id: buzzer_out
          level: 0%

  # One short beep (respects the "Sound" switch)
  - id: beep
    mode: single
    then:
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - script.execute: buzzer_tone

  # While the alarm is active: blink + beep, repeat every "Alarm repeat interval"
  - id: alarm_loop
    mode: single
    then:
      - while:
          condition:
            binary_sensor.is_on: temp_alarm
          then:
            - script.execute: blink_led
            - script.execute: beep
            - delay: !lambda 'return (uint32_t) (id(alarm_interval).state * 1000);'

  # Safe stop used by "Acknowledge alarm", the physical button and on_release.
  # Stopping scripts alone could leave the PWM output at a non-zero duty, so
  # explicitly set it to 0 % afterwards.
  - id: stop_alarm
    mode: restart
    then:
      - script.stop: alarm_loop
      - script.stop: beep
      - script.stop: buzzer_tone
      - output.set_level:
          id: buzzer_out
          level: 0%
      - switch.turn_off: led_switch
