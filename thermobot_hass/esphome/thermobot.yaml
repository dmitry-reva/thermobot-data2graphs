## ESPHome-конфиг, воспроизводящий функции прошивки THERMOBOT (ESP8266 + DS18B20 + Telegram)
## Пины: GPIO0 - DS18B20 (подтверждено на плате), GPIO4/5 - TM1637 CLK/DIO, GPIO14 - кнопка, GPIO2 - зуммер (полярность проверить).

substitutions:
  name: thermobot
  # DATA датчика DS18B20 (проверено на плате). GPIO0 - strapping-пин: подтяжка 4.7k к 3.3V
  # нормальна (загрузка из флеша), но датчик не должен тянуть линию к земле при старте.
  pin_ds18b20: GPIO0
  # Найдено в прошивке (вывод pinMode(OUTPUT) + digitalWrite(HIGH) при старте, переменная = 2).
  # GPIO2 - strapping-пин: при загрузке должен быть HIGH.
  pin_buzzer: GPIO2
  # Дисплей TM1637: TM1637Display(CLK=4, DIO=5, bitDelay=100) - найден в статическом инициализаторе
  pin_tm_clk: GPIO4
  pin_tm_dio: GPIO5
  # Кнопка: pinMode(14, INPUT_PULLUP), опрос digitalRead(14)
  pin_button: GPIO14
  tg_token: !secret tg_token
  tg_chat: !secret tg_chat

esphome:
  name: ${name}
  friendly_name: Thermobot

esp8266:
  board: esp12e        # в дампе чип флеш GD25Q32C = 4 МБ, DIO; при 1 МБ модуле используйте esp01_1m
  restore_from_flash: true

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # В оригинале: точка доступа "THERMOBOT", пароль 88888888, портал настройки
  ap:
    ssid: "THERMOBOT"
    password: "88888888"

captive_portal:

web_server:
  port: 80

# Оригинал перезагружал Wi-Fi модуль по таймеру (0..1440 мин, 0 = выкл)
number:
  - platform: template
    name: "Нижняя граница"
    id: t_low
    min_value: -55
    max_value: 125
    step: 0.1
    unit_of_measurement: "°C"
    initial_value: 5
    optimistic: true
    restore_value: true
  - platform: template
    name: "Верхняя граница"
    id: t_high
    min_value: -55
    max_value: 125
    step: 0.1
    unit_of_measurement: "°C"
    initial_value: 30
    optimistic: true
    restore_value: true
  - platform: template
    name: "Интервал оповещения"
    id: notify_interval
    min_value: 1
    max_value: 86400
    step: 1
    unit_of_measurement: "s"
    initial_value: 600
    optimistic: true
    restore_value: true
  - platform: template
    name: "Калибровка"
    id: calib
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    unit_of_measurement: "°C"
    initial_value: 0
    optimistic: true
    restore_value: true
  - platform: template
    name: "Перезагрузка Wi-Fi (мин, 0=выкл)"
    id: wifi_reboot_min
    min_value: 0
    max_value: 1440
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true

switch:
  - platform: template
    name: "Звуковой сигнал"
    id: sound_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    id: buzzer
    pin:
      number: ${pin_buzzer}
      inverted: true        # в прошивке на старте пин HIGH = тишина (активный низкий уровень).
                            # Если зуммер пищит при включении или звук инвертирован - уберите inverted.
    restore_mode: ALWAYS_OFF
    internal: true

globals:
  - id: last_alert_ms
    type: uint32_t
    initial_value: "0"

one_wire:
  - platform: gpio
    pin: ${pin_ds18b20}

# Дисплей TM1637 (4 разряда) показывает температуру, как в оригинале
display:
  - platform: tm1637
    id: tm_display
    clk_pin: ${pin_tm_clk}
    dio_pin: ${pin_tm_dio}
    intensity: 5
    update_interval: 1s
    lambda: |-
      if (id(temp).has_state()) {
        it.printf("%.1f", id(temp).state);
      } else {
        it.print("----");      // датчик не найден
      }

binary_sensor:
  - platform: gpio
    name: "Кнопка"
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms

sensor:
  - platform: dallas_temp
    name: "Температура"
    id: temp
    update_interval: 5s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - lambda: return x + id(calib).state;   # калибровка как в оригинале (-5..+5)
    on_value:
      then:
        - lambda: |-
            float t = x;
            bool out = (t < id(t_low).state) || (t > id(t_high).state);
            if (!out) { id(last_alert_ms) = 0; return; }
            uint32_t now = millis();
            if (id(last_alert_ms) == 0 || (now - id(last_alert_ms)) > (uint32_t)(id(notify_interval).state * 1000)) {
              id(last_alert_ms) = now;
              id(send_alert).execute(t);
            }
    on_error:
      then:
        - logger.log: "Нет датчика"   # в оригинале: "нет датчика"

script:
  - id: send_alert
    mode: queued
    parameters:
      t: float
    then:
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - switch.turn_on: buzzer
            - delay: 500ms
            - switch.turn_off: buzzer
      - http_request.get:
          verify_ssl: false
          url: !lambda |-
            char b[256];
            snprintf(b, sizeof(b),
              "https://api.telegram.org/bot%s/sendMessage?chat_id=%s&text=Thermobot%%20temperature%%20%.1f%%20C%%20out%%20of%%20range",
              "${tg_token}", "${tg_chat}", t);
            return std::string(b);

# Перезагрузка по таймеру (аналог "reload" в оригинале)
interval:
  - interval: 60s
    then:
      - lambda: |-
          static uint32_t min_count = 0;
          min_count++;
          int lim = (int) id(wifi_reboot_min).state;
          if (lim > 0 && min_count >= (uint32_t) lim) {
            App.safe_reboot();
          }

http_request:
  timeout: 10s
  useragent: esphome-thermobot
